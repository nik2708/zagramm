name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: '0'

      - name: Resolve required Xcode version
        run: |
          XCODE_VERSION=$(python3 -c 'import json;print(json.load(open("versions.json"))["xcode"])')
          echo "REQUIRED_XCODE=$XCODE_VERSION" >> $GITHUB_ENV
          echo "Required Xcode: $XCODE_VERSION"
          APP="/Applications/Xcode_${XCODE_VERSION}.app"
          if [ -d "$APP" ]; then
            sudo xcode-select -s "$APP/Contents/Developer"
            echo "XCODE_PREINSTALLED=true" >> $GITHUB_ENV
          else
            echo "XCODE_PREINSTALLED=false" >> $GITHUB_ENV
          fi

      - name: Install required Xcode (if missing on image)
        if: env.XCODE_PREINSTALLED == 'false'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.REQUIRED_XCODE }}

      - name: Disk space report
        run: df -h /

      - name: Restore bazel disk cache
        uses: actions/cache/restore@v4
        with:
          path: /private/var/tmp/telegram-bazel-disk-cache
          key: bazel-disk-v3-${{ github.run_number }}
          restore-keys: |
            bazel-disk-v3-

      - name: Create canonical source directory
        run: |
          set -x
          sudo mkdir -p /Users/Shared
          cp -R "$GITHUB_WORKSPACE" /Users/Shared/
          mv "/Users/Shared/$(basename "$GITHUB_WORKSPACE")" /Users/Shared/telegram-ios

      - name: Build the App
        run: |
          set -x

          # source code paths are included in the final binary, so we need to make them stable across builds
          SOURCE_DIR=/Users/Shared/telegram-ios

          # use canonical bazel root (must match the cache path above)
          BAZEL_USER_ROOT="/private/var/tmp/_bazel_containerhost"

          # transportable content-addressed cache: survives flag changes, reused across runs
          DISK_CACHE="/private/var/tmp/telegram-bazel-disk-cache"
          sudo mkdir -p "$DISK_CACHE"
          sudo chown -R "$(id -un)" "$DISK_CACHE"

          cd $SOURCE_DIR

          BUILD_NUMBER_OFFSET="$(cat build_number_offset)"

          export APP_VERSION=$(cat versions.json | python3 -c 'import json,sys;obj=json.load(sys.stdin);print(obj["app"]);')
          export COMMIT_COUNT=$(git rev-list --count HEAD)
          export COMMIT_COUNT="$(($COMMIT_COUNT+$BUILD_NUMBER_OFFSET))"
          export BUILD_NUMBER="$COMMIT_COUNT"
          echo "BUILD_NUMBER=$(echo $BUILD_NUMBER)" >> $GITHUB_ENV
          echo "APP_VERSION=$(echo $APP_VERSION)" >> $GITHUB_ENV

          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs
          python3 -u build-system/Make/Make.py \
            --bazelUserRoot="$BAZEL_USER_ROOT" \
            --cacheDir="$DISK_CACHE" \
            build \
            --configurationPath="build-system/appstore-configuration.json" \
            --codesigningInformationPath=build-system/fake-codesigning \
            --configuration=release_arm64 \
            --buildNumber="$BUILD_NUMBER"

          # collect ipa
          OUTPUT_PATH="build/artifacts"
          rm -rf "$OUTPUT_PATH"
          mkdir -p "$OUTPUT_PATH"
          if [ -f bazel-bin/Telegram/Telegram.ipa ]; then
            cp bazel-bin/Telegram/Telegram.ipa "$OUTPUT_PATH/"
          else
            for f in bazel-out/*/bin/Telegram/Telegram.ipa; do
              cp "$f" "$OUTPUT_PATH/"
            done
          fi
          ls -la "$OUTPUT_PATH"

      - name: Save bazel disk cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: /private/var/tmp/telegram-bazel-disk-cache
          key: bazel-disk-v3-${{ github.run_number }}

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-unsigned-ipa
          path: /Users/Shared/telegram-ios/build/artifacts/Telegram.ipa
          compression-level: 0
          retention-days: 30

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ env.APP_VERSION }}-build.${{ github.run_number }}
        run: |
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Ghostgram ${{ env.APP_VERSION }} (build ${{ github.run_number }})" \
            --notes "Unsigned IPA ${{ env.APP_VERSION }} (build ${{ github.run_number }}). Sign it with Sideloadly / AltStore / Apple Developer certificate before installing." \
            "/Users/Shared/telegram-ios/build/artifacts/Telegram.ipa#Telegram.ipa"
